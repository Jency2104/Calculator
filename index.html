     <div class="container">
        
        <h1>Calculator</h1>

        <div class="calculator">

            <!-- Display -->
            <div class="row g-1">

                <div class="col-9">
                    <div id="result" class="display">
                        Result
                    </div>
                </div>

                <div class="col-3">
                    <button class="btn clear w-100" onclick="clearResult()">
                        C
                    </button>
                </div>

            </div>


            <!-- First Row -->
            <div class="row g-1 mt-1">

                <div class="col-3">
                    <button class="btn number w-100" onclick="numberClick(1)">1</button>
                </div>

                <div class="col-3">
                    <button class="btn number w-100" onclick="numberClick(2)">2</button>
                </div>

                <div class="col-3">
                    <button class="btn number w-100" onclick="numberClick(3)">3</button>
                </div>

                <div class="col-3">
                    <button class="btn operator w-100" onclick="operatorClick('+')">+</button>
                </div>

            </div>


            <!-- Second Row -->
            <div class="row g-1 mt-1">

                <div class="col-3">
                    <button class="btn number w-100" onclick="numberClick(4)">4</button>
                </div>

                <div class="col-3">
                    <button class="btn number w-100" onclick="numberClick(5)">5</button>
                </div>

                <div class="col-3">
                    <button class="btn number w-100" onclick="numberClick(6)">6</button>
                </div>

                <div class="col-3">
                    <button class="btn operator w-100" onclick="operatorClick('-')">-</button>
                </div>

            </div>


            <!-- Third Row -->
            <div class="row g-1 mt-1">

                <div class="col-3">
                    <button class="btn number w-100" onclick="numberClick(7)">7</button>
                </div>

                <div class="col-3">
                    <button class="btn number w-100" onclick="numberClick(8)">8</button>
                </div>

                <div class="col-3">
                    <button class="btn number w-100" onclick="numberClick(9)">9</button>
                </div>

                <div class="col-3">
                    <button class="btn operator w-100" onclick="operatorClick('*')">x</button>
                </div>

            </div>


            <!-- Fourth Row -->
            <div class="row g-1 mt-1">

                <div class="col-3">
                    <button class="btn operator w-100" onclick="operatorClick('/')">/</button>
                </div>

                <div class="col-3">
                    <button class="btn number w-100" onclick="numberClick(0)">0</button>
                </div>

                <div class="col-3">
                    <button class="btn number w-100" onclick="numberClick('.')">.</button>
                </div>

                <div class="col-3">
                    <button class="btn operator w-100" onclick="calculate()">=</button>
                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>
